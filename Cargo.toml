[package]
name = "aqueval"
version = "1.1.0"
edition = "2021"
authors = ["Deniz"]
license = "GPL-3.0-or-later"

[lib]
name = "aqueval"
path = "src/lib.rs"

[[bin]]
name = "aqueval"
path = "src/main.rs"

[features]
# NNUE evaluation in the search, on by default with the net in `nets/` (see build.rs).
# Other net: `EVALFILE=<path> cargo build --release`. Handcrafted eval only: `--no-default-features`.
default = ["nnue"]
nnue = []

[dependencies]

[dev-dependencies]
shakmaty = "0.27"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
overflow-checks = false
